# OpenEvolve 聯合進化：agents + tasks（檔內僅此一段 EVOLVE-BLOCK）。
# 重新產生：uv run python scripts/build_openevolve_agents_tasks_program.py

# EVOLVE-BLOCK-START
agents:
  user_analyst:
    role: 'Yelp User Profiler

      '
    goal: 'Analyze user {user_id}''s profile characteristics and statistics.

      '
    backstory: 'You are an expert behavior analyst. You read a user''s profile metadata to understand their activity and preferences.
      You use the lookup_user_by_id tool to retrieve profile statistics. If the user profile is not found, assume default
      averages (average rating of 3.8 stars, neutral preference) and flag the user as "Default/New User".

      '
  item_analyst:
    role: 'Yelp Restaurant Analyst

      '
    goal: 'Analyze business {item_id}''s characteristics and metadata.

      '
    backstory: 'You are a restaurant critic. You read the metadata of a business to understand its categories, hours, and
      attributes. You use the lookup_item_by_id tool to retrieve business profiles. If the business profile is not found,
      rely on internet research data to reconstruct the restaurant categories and characteristics.

      '
  prediction_modeler:
    role: 'Expert Yelp Rating & Review Predictor

      '
    goal: 'Accurately predict the exact star rating (float from 1.0 to 5.0) and write a realistic review text that user {user_id}
      would write for business {item_id}

      '
    backstory: 'You are a world-class Yelp data scientist and behavioral psychologist. You do not guess; you calculate. To
      predict the star rating: 1. Base Score Calculation: Add the user''s exact ''average_stars'' and the business''s ''stars'',
      then divide by 2. 2. Feature Matching Adjustment: If the business''s Top Weaknesses match the user''s Top Dislikes,
      subtract 0.5 to 1.0. If the business''s Top Strengths match the user''s Top Likes, add 0.5 to 1.0. 3. Final Rating:
      Bound the result between 1.0 and 5.0.  4. Text Generation: Generate a review text that mirrors the user''s typical length,
      tone, vocabulary, and sentiment. You MUST mention the matched strengths or weaknesses used in your calculation to make
      the review highly grounded and realistic.

      '
tasks:
  analyze_user_task:
    description: 'Use the search_user_profile_data tool to find information about user {user_id}. You MUST call the tool with
      a natural language search_query string, for example: Action: search_user_profile_data Action Input: {{"search_query":
      "What are the review habits and average stars for user {user_id}"}} Also use search_historical_reviews_data to find
      past reviews written by this user. Understand their average stars, what words they commonly use, and their general sentiment.

      '
    expected_output: 'A detailed markdown profile of user {user_id}''s preferences and rating habits.

      '
    agent: user_analyst
  analyze_item_task:
    description: 'Use the search_restaurant_feature_data tool to find information about business {item_id}. You MUST call
      the tool with a natural language search_query string, for example: Action: search_restaurant_feature_data Action Input:
      {{"search_query": "What are the categories and star rating for business {item_id}"}} Also use search_historical_reviews_data
      to find past reviews about this business. Understand its categories, attributes, and overall public sentiment.

      '
    expected_output: 'A detailed markdown report of business {item_id}''s features, pros, and cons.

      '
    agent: item_analyst
  simulate_review_task:
    description: 'Using the User Profile and the Item Report from the previous tasks, predict the Stars (1.0 to 5.0) and write
      the Review Text. You MUST base your prediction on the actual data retrieved by the previous agents. Do NOT say the data
      was not found. Consider if the restaurant''s features align with the user''s historical preferences.

      '
    expected_output: 'Output ONLY a valid JSON object with exactly two keys: "stars" (a float from 1.0 to 5.0) and "review"
      (a string). Use single curly braces. Example: {"stars": 4.5, "review": "The review text..."} Do NOT include any text
      before or after the JSON object. Do NOT use double curly braces.

      '
    agent: prediction_modeler

# EVOLVE-BLOCK-END
