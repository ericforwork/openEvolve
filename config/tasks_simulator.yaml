
# EVOLVE-BLOCK-START
# 執行順序（與 simulation_crew._TASK_ORDER 一致）：先蒐集 → 最後 simulate_review 輸出 JSON

internet_research_task:
  description: >
    Provide general insights about restaurant reviews and rating behavior using internet search if available.

    Focus on:
    - Why users give 1–2 stars
    - Why users give 3 stars
    - Why users give 4–5 stars
    - Common rating factors: food, service, price, waiting time, atmosphere

    REQUIRED ACTIONS:
    - Call search_internet using a natural language query.
    - The ONLY valid input key for the tool is "search_query". Do NOT use "description" or any other key.

    STRICT RULES:
    - Do NOT fabricate information about user {user_id} or item_id {item_id}
    - Only provide general restaurant rating patterns
    - Keep the output concise
    - Maximum 5 bullet points
    - NEVER pass a dictionary with a "description" key to the tool. Use "search_query".

  expected_output: >
    Concise bullet points about general restaurant rating behavior.

  agent: internet_researcher

analyze_user_task:
  description: >
    Use the search_user_profile_data tool to find information about user {user_id}.
    You MUST call the tool with a natural language search_query string, for example:
    Action: search_user_profile_data
    Action Input: {{"search_query": "What are the review habits and average stars for user {user_id}"}}
    Also use search_historical_reviews_data to find past reviews written by this user.
    Understand their average stars, what words they commonly use, and their general sentiment.
  expected_output: >
    A detailed markdown profile of user {user_id}'s preferences and rating habits.
  agent: user_analyst

analyze_item_task:
  description: >
    Use the search_restaurant_feature_data tool to find information about business {item_id}.
    You MUST call the tool with a natural language search_query string, for example:
    Action: search_restaurant_feature_data
    Action Input: {{"search_query": "What are the categories and star rating for business {item_id}"}}
    Also use search_historical_reviews_data to find past reviews about this business.
    Understand its categories, attributes, and overall public sentiment.
    You may use general rating patterns from internet_research_task when business data is sparse.
  expected_output: >
    A detailed markdown report of business {item_id}'s features, pros, and cons.
  agent: item_analyst

analyze_reviews_task:
  description: >
    Retrieve and analyze historical reviews for user {user_id} and business {item_id}.

    STEP 1 - Retrieve reviews (REQUIRED):
    Action: lookup_reviews_by_user_and_item
    Action Input: {{"user_id": "{user_id}", "item_id": "{item_id}"}}

    STEP 2 - Analyze:
    - Highlight if a direct past review exists between the user and the business.
    - Otherwise, analyze the user's typical ratings/sentiments and the business's common feedback.

    STRICT RULES:
    - You MUST call tools ONE AT A TIME.
    - If no reviews are found, perform cross-feature matching based on restaurant categories (from analyze_item_task) and user averages (from analyze_user_task).

  expected_output: >
    A structured markdown report highlighting:
    - Direct review match (if any)
    - User's typical review tone, preferences, and rating habits
    - Business's strengths, weaknesses, and customer feedback themes
    - Overall match sentiment

  agent: review_analyst

simulate_review_task:
  description: >
    Using outputs from ALL previous tasks (Internet Research, User Profile, Item Report, and Review Analysis),
    predict the Stars (1.0 to 5.0) and write the Review Text.
    You MUST base your prediction on the actual data retrieved by the previous agents. Do NOT say the data was not found.
    Consider whether the restaurant's features align with the user's historical preferences and the review analysis.
    This is the FINAL task: your output is parsed as the submission.
  expected_output: >
    Output ONLY a valid JSON object with exactly two keys: "stars" (a float from 1.0 to 5.0) and "review" (a string).
    Use single curly braces. Example: {"stars": 4.5, "review": "The review text..."}
    Do NOT include any text before or after the JSON object. Do NOT use double curly braces.
  agent: prediction_modeler

# EVOLVE-BLOCK-END
