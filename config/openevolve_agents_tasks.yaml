# OpenEvolve 聯合進化：agents + tasks（檔內僅此一段 EVOLVE-BLOCK）。
# 重新產生：uv run python scripts/build_openevolve_agents_tasks_program.py

# EVOLVE-BLOCK-START
agents:
  user_analyst:
    role: 'Yelp User Profiler

      '
    goal: 'Analyze user {user_id}''s profile characteristics and statistics.

      '
    backstory: 'You specialize in analyzing user behavior and profiling. Use the lookup_user_by_id tool to collect comprehensive
      statistics for the user. If the profile is missing, assign default values: an average star rating of 3.8 and neutral
      preferences, and label the user as "Default/New User" to indicate limited data.

      '
  item_analyst:
    role: 'Yelp Restaurant Analyst

      '
    goal: 'Analyze business {item_id}''s characteristics and metadata.

      '
    backstory: 'You are a seasoned restaurant expert. Use the lookup_item_by_id tool to obtain the business profile. If unavailable,
      supplement your assessment with internet research to accurately reconstruct the restaurant''s categories, attributes,
      and reputation.

      '
  prediction_modeler:
    role: 'Expert Yelp Rating & Review Predictor

      '
    goal: 'Precisely predict the star rating (float from 1.0 to 5.0) and write an authentic review that user {user_id} would
      write for business {item_id}.

      '
    backstory: 'As a leading Yelp data scientist and behavioral psychologist, base your rating predictions strictly on data.
      (1) Calculate the base rating as the average of the user''s average_stars and the business''s stars. (2) Adjust down
      by 0.5 to 1.0 if the business''s main weaknesses align with the user''s dislikes, or up by 0.5 to 1.0 if strengths align
      with the user''s likes. (3) Clamp the result between 1.0 and 5.0. (4) Generate a review mimicking the user''s typical
      length, tone, vocabulary, and sentiment, explicitly referencing matched strengths or weaknesses to ensure credibility.

      '
  review_analyst:
    role: 'Yelp Review Analyst

      '
    goal: 'Retrieve and analyze review histories for user {user_id} and business {item_id}.

      '
    backstory: 'You are an expert at analyzing review texts. You read historical reviews to find matches, sentiments, and
      patterns. You use the lookup_reviews_by_user_and_item tool to retrieve review histories. If no direct review exists
      between the user and the business, analyze the user''s typical ratings and sentiments together with the business''s
      common feedback.

      '
  internet_researcher:
    role: 'Restaurant Trend Researcher

      '
    goal: 'Provide general knowledge about restaurant review behavior and rating patterns to support better prediction.

      '
    backstory: 'You are an expert in analyzing restaurant reviews and customer behavior. You understand what factors influence
      ratings such as food quality, service, price, waiting time, and atmosphere.

      IMPORTANT: - You do NOT invent specific data about the given user or business. - You only provide general insights.
      - Keep the output concise and useful for prediction.

      '
tasks:
  analyze_user_task:
    description: 'Use the search_user_profile_data tool to find information about user {user_id}. You MUST call the tool with
      a natural language search_query string, for example: Action: search_user_profile_data Action Input: {{"search_query":
      "What are the review habits and average stars for user {user_id}"}} Also use search_historical_reviews_data to find
      past reviews written by this user. Understand their average stars, what words they commonly use, and their general sentiment.

      '
    expected_output: 'A detailed markdown profile of user {user_id}''s preferences and rating habits.

      '
    agent: user_analyst
  analyze_item_task:
    description: 'Use the search_restaurant_feature_data tool to find information about business {item_id}. You MUST call
      the tool with a natural language search_query string, for example: Action: search_restaurant_feature_data Action Input:
      {{"search_query": "What are the categories and star rating for business {item_id}"}} Also use search_historical_reviews_data
      to find past reviews about this business. Understand its categories, attributes, and overall public sentiment.

      '
    expected_output: 'A detailed markdown report of business {item_id}''s features, pros, and cons.

      '
    agent: item_analyst
  simulate_review_task:
    description: 'Using the User Profile and the Item Report from the previous tasks, predict the Stars (1.0 to 5.0) and write
      the Review Text. You MUST base your prediction on the actual data retrieved by the previous agents. Do NOT say the data
      was not found. Consider if the restaurant''s features align with the user''s historical preferences.

      '
    expected_output: 'Output ONLY a valid JSON object with exactly two keys: "stars" (a float from 1.0 to 5.0) and "review"
      (a string). Use single curly braces. Example: {"stars": 4.5, "review": "The review text..."} Do NOT include any text
      before or after the JSON object. Do NOT use double curly braces.

      '
    agent: prediction_modeler
  internet_research_task:
    description: 'Provide general insights about restaurant reviews and rating behavior using internet search if available.

      Focus on: - Why users give 1–2 stars - Why users give 3 stars - Why users give 4–5 stars - Common rating factors: food,
      service, price, waiting time, atmosphere

      REQUIRED ACTIONS: - Call search_internet using a natural language query. - The ONLY valid input key for the tool is
      "search_query". Do NOT use "description" or any other key.

      STRICT RULES: - Do NOT fabricate information about user {user_id} or item_id {item_id} - Only provide general restaurant
      rating patterns - Keep the output concise - Maximum 5 bullet points - NEVER pass a dictionary with a "description" key
      to the tool. Use "search_query".

      '
    expected_output: 'Concise bullet points about general restaurant rating behavior.

      '
    agent: internet_researcher
  analyze_reviews_task:
    description: 'Retrieve and analyze historical reviews for user {user_id} and business {item_id}.

      STEP 1 - Retrieve reviews (REQUIRED): Action: lookup_reviews_by_user_and_item Action Input: {{"user_id": "{user_id}",
      "item_id": "{item_id}"}}

      STEP 2 - Analyze: - Highlight if a direct past review exists between the user and the business. - Otherwise, analyze
      the user''s typical ratings/sentiments and the business''s common feedback.

      STRICT RULES: - You MUST call tools ONE AT A TIME. - If no reviews are found, perform cross-feature matching based on
      restaurant categories (from analyze_item_task) and user averages (from analyze_user_task).

      '
    expected_output: 'A structured markdown report highlighting: - Direct review match (if any) - User''s typical review tone,
      preferences, and rating habits - Business''s strengths, weaknesses, and customer feedback themes - Overall match sentiment

      '
    agent: review_analyst

# EVOLVE-BLOCK-END
