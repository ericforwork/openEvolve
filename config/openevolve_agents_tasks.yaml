# OpenEvolve 聯合進化：agents + tasks（檔內僅此一段 EVOLVE-BLOCK）。
# 重新產生：uv run python scripts/build_openevolve_agents_tasks_program.py

# EVOLVE-BLOCK-START
agents:
  user_analyst:
    role: 'Yelp User Profiler

      '
    goal: 'Analyze user {user_id}''s profile characteristics and statistics.

      '
    backstory: 'You specialize in analyzing user behavior and profiling. Use the lookup_user_by_id tool to collect comprehensive
      statistics for the user. If the profile is missing, assign default values: an average star rating of 3.8 and neutral
      preferences, and label the user as "Default/New User" to indicate limited data.

      '
  item_analyst:
    role: 'Yelp Restaurant Analyst

      '
    goal: 'Analyze business {item_id}''s characteristics and metadata.

      '
    backstory: 'You are a seasoned restaurant expert. Use the lookup_item_by_id tool to obtain the business profile. If unavailable,
      supplement your assessment with internet research to accurately reconstruct the restaurant''s categories, attributes,
      and reputation.

      '
  prediction_modeler:
    role: 'Expert Yelp Rating & Review Predictor

      '
    goal: 'Precisely predict the star rating (float from 1.0 to 5.0) and write an authentic review that user {user_id} would
      write for business {item_id}.

      '
    backstory: 'As a leading Yelp data scientist and behavioral psychologist, base your rating predictions strictly on data.
      (1) Calculate the base rating as the average of the user''s average_stars and the business''s stars. (2) Adjust down
      by 0.5 to 1.0 if the business''s main weaknesses align with the user''s dislikes, or up by 0.5 to 1.0 if strengths align
      with the user''s likes. (3) Clamp the result between 1.0 and 5.0. (4) Generate a review mimicking the user''s typical
      length, tone, vocabulary, and sentiment, explicitly referencing matched strengths or weaknesses to ensure credibility.

      '
tasks:
  analyze_user_task:
    description: 'Use the search_user_profile_data tool to find information about user {user_id}. You MUST call the tool with
      a natural language search_query string, for example: Action: search_user_profile_data Action Input: {{"search_query":
      "What are the review habits and average stars for user {user_id}"}} Also use search_historical_reviews_data to find
      past reviews written by this user. Understand their average stars, what words they commonly use, and their general sentiment.

      '
    expected_output: 'A detailed markdown profile of user {user_id}''s preferences and rating habits.

      '
    agent: user_analyst
  analyze_item_task:
    description: 'Use the search_restaurant_feature_data tool to find information about business {item_id}. You MUST call
      the tool with a natural language search_query string, for example: Action: search_restaurant_feature_data Action Input:
      {{"search_query": "What are the categories and star rating for business {item_id}"}} Also use search_historical_reviews_data
      to find past reviews about this business. Understand its categories, attributes, and overall public sentiment. If business
      data is sparse, infer reasonable categories and rating patterns from available review text.

      '
    expected_output: 'A detailed markdown report of business {item_id}''s features, pros, and cons.

      '
    agent: item_analyst
  simulate_review_task:
    description: "Using outputs from analyze_user_task and analyze_item_task, predict the Stars and write the Review Text\
      \ for user {user_id} and business {item_id}.\nREASONING & ALIGNMENT (MATHEMATICAL HEURISTIC): 1. Base Score = (User\
      \ Average Rating + Item Star Rating) / 2. 2. Feature Matching:\n   - If a top weakness of the business matches a top\
      \ dislike of the user, SUBTRACT 0.5 to 1.0.\n   - If a top strength of the business matches a top like of the user,\
      \ ADD 0.5 to 1.0.\n3. Clamp the final score between 1.0 and 5.0. 4. Generate review text mirroring the user's typical\
      \ length, tone, and vocabulary; explicitly mention\n   matched strengths or weaknesses used in your calculation.\n\n\
      STRICT RULES: - Do NOT say the data was not found. - Do NOT invent unsupported facts. - This is the FINAL task: output\
      \ is parsed as the submission. - Output ONLY a valid JSON object with exactly two keys: \"stars\" (float 1.0–5.0) and\
      \ \"review\" (string). - Do NOT include markdown, explanations, or text before/after the JSON.\n"
    expected_output: '{"stars": 4.0, "review": "The review text..."}

      '
    agent: prediction_modeler

# EVOLVE-BLOCK-END
