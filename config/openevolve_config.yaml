# OpenEvolve — joint evolution of agents + tasks (single file, one EVOLVE-BLOCK)
# Initial program : config/openevolve_agents_tasks.yaml
# Regenerate bundle: uv run python scripts/build_openevolve_agents_tasks_program.py
# Evaluator       : openevolve_evaluator.py
# Run command     :
#   uv run openevolve config/openevolve_agents_tasks.yaml openevolve_evaluator.py \
#     --config config/openevolve_config.yaml \
#     --output config/openevolve_output

# --- General -----------------------------------------------------------------
max_iterations: 30
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# --- Evolution strategy -------------------------------------------------------
# Full-rewrite is recommended for YAML / prompt evolution
# (diff-based mode generates SEARCH/REPLACE patches that easily corrupt YAML structure)
diff_based_evolution: false
language: "text"
max_code_length: 32000   # agents + tasks bundle grows with evolution

# --- LLM ----------------------------------------------------------------------
llm:
  models:
    - name: "gpt-4.1-mini"
      weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: null          # reads from OPENAI_API_KEY env variable
  temperature: 0.7
  max_tokens: 4096
  timeout: 120
  retries: 3           # conservative; many retries increase wall time without helping much
  retry_delay: 10      # backoff spacing for rate limits (raise if you see 429)

# --- Prompt -------------------------------------------------------------------
prompt:
  system_message: |
    You are an expert prompt engineer for multi-agent CrewAI pipelines on a review platform.

    The program file has **one** `# EVOLVE-BLOCK-START` / `# EVOLVE-BLOCK-END` region containing two
    top-level YAML keys: `agents` and `tasks`.

    - Under `agents`, each key is a CrewAI agent name mapping to `role`, `goal`, and `backstory`.
    - Under `tasks`, each key is a pipeline task name mapping to `description`, `expected_output`,
      and `agent` (must reference an agent defined under `agents`).

    Goal: improve simulator `combined_score` (rating + review quality) without breaking tool use
    or the final JSON contract (`stars`, `review`).

    Hard rules:
    - Output **valid YAML only** for the full file; keep the EVOLVE-BLOCK comment lines.
    - Do **not** remove the top-level keys `agents` or `tasks`.
    - Do **not** rename or delete these task keys under `tasks` (execution order is fixed in code):
      analyze_user_task, analyze_item_task, simulate_review_task (must remain last — final JSON output).
    - Do **not** rename or delete these agent keys under `agents` (crew wiring depends on them):
      user_analyst, item_analyst, prediction_modeler.
    - Keep every task's `agent:` field identical to an existing agent key (do not point tasks at
      non-existent agents).
    - For tasks that use ReAct tools (`search_*`, `lookup_*`), preserve required Action /
      Action Input patterns and tool names; clarify wording only.
    - Preserve final prediction tasks so the pipeline still ends with JSON containing "stars" and "review".
    - **Structural contract (enforced by evaluator):** the set of top-level keys under `agents` and `tasks`
      must match the repository baselines exactly — no new keys, no deletions, no renames.
      Under each agent/task block, the **set of YAML keys** must also match the baseline (only edit
      string values inside existing fields). Do **not** change any task's `agent:` string value.
    - If you violate the contract, fitness will be **0.0** without running simulation (wasted mutants are discarded).
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false

# --- Database -----------------------------------------------------------------
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  migration_interval: 10
  migration_rate: 0.1
  # Use built-in features; no custom feature_dimensions needed
  feature_dimensions:
    - "complexity"
    - "diversity"

# --- Evaluator ----------------------------------------------------------------
evaluator:
  # Each simulation run: 5 tasks x up to 5 min/task with 2 workers ~ ~15 min worst case
  timeout: 900
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false   # we only have evaluate(), no stage1/stage2
