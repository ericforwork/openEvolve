# OpenEvolve configuration — evolve CrewAI *task* prompts (tasks_simulator.yaml)
# Initial program : config/tasks_simulator.yaml
# Evaluator       : openevolve_evaluator.py
# Run command     :
#   uv run openevolve config/tasks_simulator.yaml openevolve_evaluator.py \
#     --config config/openevolve_config.yaml \
#     --output config/openevolve_output

# --- General -----------------------------------------------------------------
max_iterations: 30
checkpoint_interval: 5
log_level: "INFO"
random_seed: 42

# --- Evolution strategy -------------------------------------------------------
# Full-rewrite is recommended for YAML / prompt evolution
# (diff-based mode generates SEARCH/REPLACE patches that easily corrupt YAML structure)
diff_based_evolution: false
language: "text"
max_code_length: 18000   # tasks_simulator.yaml + EVOLVE-BLOCK exceeds 10k chars

# --- LLM ----------------------------------------------------------------------
llm:
  models:
    - name: "gpt-4.1-mini"
      weight: 1.0
  api_base: "https://api.openai.com/v1"
  api_key: null          # reads from OPENAI_API_KEY env variable
  temperature: 0.7
  max_tokens: 4096
  timeout: 120
  retries: 3           # conservative; many retries increase wall time without helping much
  retry_delay: 10      # backoff spacing for rate limits (raise if you see 429)

# --- Prompt -------------------------------------------------------------------
prompt:
  system_message: |
    You are an expert prompt engineer for multi-agent CrewAI pipelines on a review platform.

    You are evolving the **task definitions** inside `config/tasks_simulator.yaml` (the section
    between `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END`). Each task is a YAML mapping with
    fields such as `description`, `expected_output`, and `agent` (the CrewAI agent name).

    Goal: improve `combined_score` from the simulator — ratings closer to ground truth and
    reviews that match user tone — by tightening instructions inside task `description` /
    `expected_output` without breaking the toolchain.

    Hard rules:
    - Output **valid YAML only** for the full file (keep the two EVOLVE-BLOCK comment lines).
    - Do **not** rename or delete any of these top-level task keys (order is fixed in code):
      internet_research_task, analyze_user_task, analyze_item_task, analyze_reviews_task,
      collaborative_reasoning_task, predict_review_task, review_prediction_task,
      final_prediction_task, coordinate_workflow_task.
    - Do **not** change the `agent:` field of any task (must stay aligned with `config/agents.yaml`).
    - For tasks that use ReAct tools (`lookup_*`, `search_internet`), keep the **exact**
      Action / Action Input patterns and tool names required in the current descriptions;
      you may clarify wording but must not remove mandatory steps or invent alternate tools.
    - Preserve final JSON-output tasks so the pipeline still ends with a JSON object containing
      "stars" and "review" as required by the simulator contract.
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: false

# --- Database -----------------------------------------------------------------
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  migration_interval: 10
  migration_rate: 0.1
  # Use built-in features; no custom feature_dimensions needed
  feature_dimensions:
    - "complexity"
    - "diversity"

# --- Evaluator ----------------------------------------------------------------
evaluator:
  # Each simulation run: 5 tasks x up to 5 min/task with 2 workers ~ ~15 min worst case
  timeout: 900
  max_retries: 2
  parallel_evaluations: 1
  cascade_evaluation: false   # we only have evaluate(), no stage1/stage2
